<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EE3 考卷速查">
    <meta name="theme-color" content="#0b0f19">
    <title>《電子學(三) EE3》歷屆考試速查與列印 App | 薛光華老師</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #070a12;
            --bg-app: #0b0f19;
            --bg-card: #131b2e;
            --bg-card-hover: #1a253e;
            --border-subtle: #1e293b;
            --border-accent: #2e4069;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --font-main: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --app-max-width: 480px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* DESKTOP-VS-APP CONTAINER WRAPPER */
        .app-container {
            width: 100%;
            max-width: var(--app-max-width);
            min-height: 100vh;
            background: var(--bg-app);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.7);
            border-left: 1px solid var(--border-subtle);
            border-right: 1px solid var(--border-subtle);
            padding-bottom: 96px; /* Space for bottom tab bar */
            transition: max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* WIDE DESKTOP MODE (Optional toggle for PC users) */
        body.wide-mode .app-container {
            max-width: 1200px;
        }

        /* TOP APP BAR (Sticky) */
        .app-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 15, 25, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .app-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }
        .app-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
            flex-shrink: 0;
        }
        .app-title-group {
            display: flex;
            flex-direction: column;
        }
        .app-title {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .app-ver {
            font-size: 10.5px;
            color: var(--primary);
            background: rgba(59, 130, 246, 0.15);
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 700;
        }
        .app-subtitle {
            font-size: 11px;
            color: var(--text-sub);
        }
        .app-bar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-app-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-subtle);
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
        }
        .btn-app-action:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* SEGMENTED MODE SWITCHER (解答版 vs 題目卷) */
        .app-segmented-tabs {
            padding: 10px 16px 4px;
            background: var(--bg-app);
        }
        .segmented-pill-wrapper {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 3px;
            display: flex;
            gap: 3px;
        }
        .segmented-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 8px 12px;
            border-radius: 9px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .segmented-btn.active {
            background: #2563eb;
            color: #fff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }
        .segmented-btn.active.question-mode {
            background: #d97706;
            box-shadow: 0 2px 8px rgba(217, 119, 6, 0.4);
        }

        /* APP SEARCH BAR */
        .app-search-section {
            padding: 8px 16px;
        }
        .app-search-box {
            position: relative;
            width: 100%;
        }
        .app-search-input {
            width: 100%;
            background: #131b2e;
            border: 1px solid var(--border-subtle);
            color: #fff;
            padding: 10px 38px 10px 38px;
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s;
        }
        .app-search-input:focus {
            border-color: var(--primary);
            background: #162038;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
        }
        .search-icon-left {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: #64748b;
            pointer-events: none;
        }
        .search-clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #334155;
            color: #cbd5e1;
            border: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 11px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* HORIZONTAL SCROLLING FILTER CHIPS */
        .app-filter-chips {
            display: flex;
            gap: 8px;
            padding: 6px 16px 10px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .app-filter-chips::-webkit-scrollbar {
            display: none;
        }
        .filter-chip {
            flex-shrink: 0;
            background: #131b2e;
            border: 1px solid var(--border-subtle);
            color: #cbd5e1;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .filter-chip:hover {
            border-color: #3b82f6;
            color: #fff;
        }
        .filter-chip.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--primary);
            color: #60a5fa;
            font-weight: 700;
        }
        .filter-chip.active.rec-chip {
            background: rgba(245, 158, 11, 0.2);
            border-color: var(--warning);
            color: #fbbf24;
        }

        /* GITHUB CDN BANNER (App Style) */
        .app-cloud-card {
            margin: 6px 16px 10px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, rgba(59, 130, 246, 0.15) 100%);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .cloud-card-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cloud-badge-icon {
            font-size: 22px;
        }
        .cloud-text-title {
            font-size: 12.5px;
            font-weight: 700;
            color: #34d399;
        }
        .cloud-text-desc {
            font-size: 11px;
            color: #94a3b8;
        }
        .btn-cloud-visit {
            background: #2563eb;
            color: #fff;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }

        /* CARDS STREAM CONTAINER */
        .app-stream {
            padding: 4px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        body.wide-mode .app-stream {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
        }

        /* NATIVE APP EXAM CARD */
        .app-exam-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }
        .app-exam-card:hover {
            border-color: var(--border-accent);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        .app-exam-card.featured {
            border: 1.5px solid var(--warning);
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.08) 0%, rgba(19, 27, 46, 0.95) 100%);
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.12);
        }
        .app-exam-card.redundant {
            opacity: 0.6;
            border-style: dashed;
        }
        .app-exam-card.redundant:hover {
            opacity: 1;
        }

        /* Card Header Row */
        .card-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .card-tags-left {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .num-pill {
            font-family: var(--font-mono);
            font-size: 11.5px;
            font-weight: 700;
            color: #06b6d4;
            background: rgba(6, 182, 212, 0.12);
            padding: 2px 8px;
            border-radius: 6px;
        }
        .rec-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .rec-aio {
            background: linear-gradient(135deg, #f59e0b, #ec4899);
            color: #fff;
        }
        .rec-must {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
        }
        .rec-good {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #60a5fa;
        }
        .rec-opt {
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.4);
            color: #c084fc;
        }
        .rec-skip {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        /* Card Bookmark / Select Checkbox */
        .card-check-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .check-circle {
            width: 22px;
            height: 22px;
            border: 2px solid #475569;
            border-radius: 50%;
            display: grid;
            place-content: center;
            transition: all 0.2s;
        }
        .check-circle.checked {
            background: var(--primary);
            border-color: var(--primary);
        }
        .check-circle.checked::after {
            content: "✓";
            color: #fff;
            font-size: 13px;
            font-weight: 900;
        }

        /* Card Title & Content */
        .card-body {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .card-title-text {
            font-size: 15.5px;
            font-weight: 700;
            color: #fff;
            line-height: 1.4;
        }
        .card-advice-bubble {
            background: rgba(15, 23, 42, 0.85);
            border-left: 3px solid var(--primary);
            padding: 8px 10px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            line-height: 1.45;
            color: #cbd5e1;
        }
        .app-exam-card.featured .card-advice-bubble {
            border-left-color: var(--warning);
            background: rgba(30, 25, 15, 0.8);
        }
        .app-exam-card.redundant .card-advice-bubble {
            border-left-color: var(--danger);
            color: #fca5a5;
        }

        /* Card Meta Specs Row */
        .card-specs-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11.5px;
            color: #94a3b8;
            flex-wrap: wrap;
        }
        .spec-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #111827;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .spec-pill strong {
            color: #fff;
        }

        /* Touch Swipeable Thumbnail Strip */
        .card-thumb-carousel {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 6px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
        .card-thumb-carousel::-webkit-scrollbar {
            height: 4px;
        }
        .card-thumb-carousel::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 2px;
        }
        .app-thumb-box {
            position: relative;
            flex-shrink: 0;
            width: 72px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            background: #0f172a;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .app-thumb-box:active {
            transform: scale(0.95);
        }
        .app-thumb-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-thumb-badge {
            position: absolute;
            bottom: 3px;
            right: 3px;
            background: rgba(0, 0, 0, 0.75);
            font-size: 9px;
            font-weight: 700;
            color: #e2e8f0;
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* Native App Touch Action Buttons */
        .card-actions-app {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 4px;
        }
        .btn-native-dl {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            border: none;
            padding: 11px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.15s ease;
            cursor: pointer;
        }
        .btn-native-dl:active {
            transform: scale(0.98);
        }
        .btn-native-preview {
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.15s;
        }
        .btn-native-preview:hover {
            background: #27354f;
            color: #fff;
        }
        .btn-native-cart {
            background: #18223c;
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn-native-cart.added {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.5);
            color: #34d399;
        }

        /* BOTTOM APP NAVIGATION BAR (Native iOS/Material Tab Bar) */
        .bottom-nav-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: var(--app-max-width);
            height: 72px;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        body.wide-mode .bottom-nav-bar {
            max-width: 1200px;
        }

        .nav-tab-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }
        .nav-tab-item:hover {
            color: #94a3b8;
        }
        .nav-tab-item.active {
            color: var(--primary);
        }
        .nav-tab-icon {
            font-size: 20px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-badge-count {
            position: absolute;
            top: 8px;
            right: calc(50% - 20px);
            background: #ef4444;
            color: #fff;
            font-size: 10px;
            font-weight: 800;
            padding: 1px 5px;
            border-radius: 999px;
            min-width: 16px;
            text-align: center;
        }

        /* FLOATING PRINT SUMMARY SHEET / TOAST */
        .floating-cart-summary {
            position: fixed;
            bottom: 78px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: calc(var(--app-max-width) - 24px);
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 999;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        body.wide-mode .floating-cart-summary {
            max-width: 1176px;
        }
        .cart-summary-stats {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 12px;
            color: #cbd5e1;
        }
        .cart-summary-highlight {
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 800;
            color: #f59e0b;
        }
        .btn-cart-print-now {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* LIGHTBOX MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(10px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal.show { display: flex; }
        .modal-content {
            max-width: 95vw;
            max-height: 85vh;
            border-radius: 12px;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #1e293b;
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: grid;
            place-content: center;
        }

        /* REAL MOBILE PHONES FULLSCREEN OPTIMIZATION */
        @media (max-width: 768px) {
            .app-container {
                max-width: 100% !important;
                border-left: none;
                border-right: none;
                box-shadow: none;
            }
            .bottom-nav-bar {
                max-width: 100% !important;
            }
            .floating-cart-summary {
                max-width: calc(100% - 24px) !important;
            }
            #btnDesktopToggle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">
        
        <!-- STICKY TOP APP BAR -->
        <header class="app-bar">
            <a href="index.html" class="app-brand">
                <div class="app-icon">⚡</div>
                <div class="app-title-group">
                    <div class="app-title">
                        EE3 考卷速查

        const imagesMeta = [{"index": 1, "filename": "FB_IMG_1792568117636.jpg", "category": "第四次小考 (Quiz 4)", "exam_type": "第四次小考", "year": "113學年度 第1學期 (113_1)", "type": "官方手寫解答", "page_info": "Page 1 / 題目1", "title": "題目1：雙級 BJT 並串回授放大器交流分析 (前半部)", "desc": "Q1、Q2 BJT 電路分析。判定為並串組態 (Shunt-Series)。求開路迴路等效模型 (A')，計算 Ri'、Ro' 及 A'z = Io'/Is'。", "version_note": "113_1 最新版手寫解答，右下角標註頁碼 [1]。", "keywords": "BJT, 並串, Shunt-Series, 開路迴路, Ri', Ro', A'z"}, {"index": 2, "filename": "FB_IMG_1792568119359.jpg", "category": "第四次小考 (Quiz 4)", "exam_type": "第四次小考", "year": "113學年度 第1學期 (113_1)", "type": "官方手寫解答", "page_info": "Page 2 / 題目1 接續", "title": "題目1：雙級 BJT 並串回授放大器交流分析 (後半部)", "desc": "接續題目1。(c) 回授網路 β = I1/I2 = -R2/(R1+R2)；(d)(e)(f) 計算 Azf、Rif、Rof；(g)(h)(i) 計算整體輸入阻抗 Rin、輸出阻抗 Rout 及電壓增益 Av = Vo/Vs。", "version_note": "113_1 最新版手寫解答，右下角標註頁碼 [2]。", "keywords": "β, Azf, Rif, Rof, Rin, Rout, Av"}, {"index": 3, "filename": "FB_IMG_1792568120859.jpg", "category": "第四次小考 (Quiz 4)", "exam_type": "第四次小考", "year": "113學年度 第1學期 (113_1)", "type": "官方手寫解答", "page_info": "Page 3 / 題目2", "title": "題目2：三級 BJT 串串回授放大器交流分析 (前半部)", "desc": "Q1, Q2, Q3 三級 BJT 電路分析。判定為串串組態 (Series-Series)。求開路迴路等效模型，計算 Ri'、Ro' 及 A'g = Io'/Vs'。", "version_note": "本題與 112_1 小考練習解答題目1 (圖28) 電路完全一致，113_1 編為小考題目2。頁碼 [3]。", "keywords": "三級BJT, 串串, Series-Series, Ri', Ro', A'g"}, {"index": 4, "filename": "FB_IMG_1792568122476.jpg", "category": "第四次小考 (Quiz 4)", "exam_type": "第四次小考", "year": "113學年度 第1學期 (113_1)", "type": "官方手寫解答", "page_info": "Page 4 / 題目2 接續", "title": "題目2：三級 BJT 串串回授放大器交流分析 (後半部)", "desc": "接續題目2。(c) 回授網路 β；(d)(e)(f) 閉迴路參數 Af、Rif、Rof；(g)(h)(i) 整體電路 Rin、Rout、電壓增益 Av = -Af * RL。", "version_note": "與 112_1 小考練習解答第2頁 (圖29) 內容完全一致，頁碼 [4]。", "keywords": "β, Af, Rif, Rof, Rin, Rout, Av"}, {"index": 5, "filename": "FB_IMG_1792568134648.jpg", "category": "第五次小考 (Quiz 5)", "exam_type": "第五次小考", "year": "114學年度 第2學期 (114_2)", "type": "官方手寫解答", "page_info": "題目1", "title": "題目1：NMOS 共閘極 (CG) 放大器交流分析", "desc": "NMOS Common-Gate 放大器電路，含交流小訊號模型與驅動分析。推導 Rin = 1/gm (5%)、Rout = RD // RL (5%)、Av = Vo/Vi = (RD//RL)/(Rsig + 1/gm) (15%) 與兩級電壓比 (Vo/Vg)*(Vg/Vi)。", "version_note": "114_2 標記版本，右上角附完整計分配分標記。", "keywords": "NMOS, CG, Common Gate, Rin, Rout, Av"}, {"index": 6, "filename": "FB_IMG_1792568136115.jpg", "category": "第五次小考 (Quiz 5)", "exam_type": "第五次小考", "year": "114學年度 第2學期 (114_2)", "type": "官方手寫解答", "page_info": "題目2", "title": "題目2：NMOS 放大器 (含源極電阻 Rs, ro ≠ ∞) 交流分析", "desc": "考慮通道長度調變 ro ≠ ∞ 與源極電阻 Rs 之 NMOS 放大器。推導 Rin = R1 // R2 (5%)、Rout = RL // RD // [ro + (1+μ)Rs] (5%) 及整體增益 Av = Vo/Vsig 公式。", "version_note": "114_2 標記版本，詳細標註 μ = gm*ro 及各項配分。", "keywords": "NMOS, ro, Rs, μ=gm*ro, Rin, Rout, Av"}, {"index": 7, "filename": "FB_IMG_1792568137728.jpg", "category": "第五次小考 (Quiz 5)", "exam_type": "第五次小考", "year": "114學年度 第2學期 (114_2)", "type": "官方手寫解答", "page_info": "題目3", "title": "題目3：雙 MOSFET (Q1, Q2) 疊接戴維寧等效電路分析", "desc": "Q1 與 Q2 上下疊接 MOSFET 電路，分別從節點看入進行源極與汲極戴維寧等效 (TEQs, TEQD)。推導輸出電壓 Vo 之嚴謹公式 (25%)。", "version_note": "114_2 標記版本，戴維寧等效 (Thevenin Equivalent) 專題題型。", "keywords": "MOSFET, TEQs, TEQD, 戴維寧等效, Vo"}, {"index": 8, "filename": "FB_IMG_1792568139529.jpg", "category": "第五次小考 (Quiz 5)", "exam_type": "第五次小考", "year": "114學年度 第2學期 (114_2)", "type": "官方手寫解答", "page_info": "題目4", "title": "題目4：三級 MOSFET 放大器 (Q1, Q2, Q3) 交流多級增益分析", "desc": "Q1 (P-MOS/N-MOS), Q2, Q3 組成之三級多級放大器。推導輸入阻抗 Rin = Rs + R1//R2 (5%)、Rout = RL//R10//[ro3+(1+μ3)R9] (5%) 及多級級聯增益 Av = (Vo/Vg3)*(Vg3/Vg2)*(Vg2/Vg1)*(Vg1/Vs) (15%)。", "version_note": "114_2 標記版本，多級串接經典分析題。", "keywords": "三級MOSFET, 多級放大器, Rin, Rout, Av 級聯分解"}, {"index": 9, "filename": "FB_IMG_1792568171678.jpg", "category": "第六次小考 (Quiz 6)", "exam_type": "第六次小考", "year": "114學年度 第1學期 (114_1) [教師更新版]", "type": "官方手寫解答", "page_info": "Page 1 / 題目1 & 題目2", "title": "題目1：OPAMP 差動放大器平衡條件 & 題目2：T型回授網路反相放大器", "desc": "題目1：推導 OPAMP 差動放大器消除共模電壓的平衡條件 R1/R2 = R3/R4 及 Vo = (R2/R1)(V2-V1)；題目2：T 型回授電路 (Ra, Rb, Rc, Rd) 反相增益 Vo/Vi = -(Rb/Ra)[1 + Rd/Rc + Rd/Rb]。", "version_note": "【版本更新】114_1 更新版，與 113_1 (圖25) 題目完全相同，本版增益書寫更工整，頁碼 [1]。", "keywords": "OPAMP, 差動放大器, 平衡條件, T型回授網路, 反相放大器"}, {"index": 10, "filename": "FB_IMG_1792568173161.jpg", "category": "第六次小考 (Quiz 6)", "exam_type": "第六次小考", "year": "114學年度 第1學期 (114_1) [教師更新版]", "type": "官方手寫解答", "page_info": "Page 2 / 題目3", "title": "題目3：負阻抗轉換器 (NIC, Negative Impedance Converter)", "desc": "OPAMP 正負回授組合之負阻抗轉換電路。推導節點電壓 Vo = (1 + R2/R1)Vt、測試電流 It，求出等效輸入阻抗 Rin = Vt/It = -R3*(R1/R2)。若 R1=R2 則 Rin = -R3。", "version_note": "【版本更新】114_1 更新版，與 113_1 (圖26) 題目相同，頁碼 [2]。", "keywords": "NIC, 負阻抗轉換器, Rin = -R3*(R1/R2), OPAMP"}, {"index": 11, "filename": "FB_IMG_1792568174915.jpg", "category": "第六次小考 (Quiz 6)", "exam_type": "第六次小考", "year": "114學年度 第1學期 (114_1) [教師更新版]", "type": "官方手寫解答", "page_info": "Page 3 / 題目4", "title": "題目4：通用阻抗轉換器 (GIC, Generalized Impedance Converter)", "desc": "雙理想 OPAMP 與 5 個阻抗元件 (Za, Zb, Zc, Zd, Ze) 構成之 GIC 電路。推導各節點電壓 Vx, Vy 與各支路電流，證得輸入阻抗 Zin = Vt/It = (Za*Zc*Ze)/(Zb*Zd)。", "version_note": "【版本更新】114_1 更新版，與 113_1 (圖27) 題目相同，此題為濾波器實作必備考題，頁碼 [3]。", "keywords": "GIC, 通用阻抗轉換器, Zin = (Za*Zc*Ze)/(Zb*Zd), 雙OPAMP"}, {"index": 12, "filename": "FB_IMG_1792568226441.jpg", "category": "期中考 (Midterm) 111_1", "exam_type": "期中考", "year": "111學年度 第1學期 (111_1)", "type": "官方手寫解答", "page_info": "Page 1 / 題目1(a)", "title": "題目1(a)：Series-Shunt (串並) 理想與非理想模型推導", "desc": "薛光華老師期中考題目1解答(a)：繪製 Series-Shunt 回授放大器雙埠 h 參數等效電路，寫出 V1 = h11*I1 + h12*V2, I2 = h21*I1 + h22*V2 矩陣方程及簡化模型。", "version_note": "111_1 期中考官方10頁詳解之第 1 頁，右下角標註頁碼 [1]。", "keywords": "Series-Shunt, 串並, h參數, 雙埠網路, 理想與非理想模型"}, {"index": 13, "filename": "FB_IMG_1792568227713.jpg", "category": "期中考 (Midterm) 111_1", "exam_type": "期中考", "year": "111學年度 第1學期 (111_1)", "type": "官方手寫解答", "page_info": "Page 2 / 題目1(b)", "title": "題目1(b)：Shunt-Series (並串) 理想與非理想模型推導", "desc": "薛光華老師期中考題目1解答(b)：繪製 Shunt-Series 回授放大器雙埠 g 參數等效電路，寫出 I1 = g11*V1 + g12*I2, V2 = g21*V1 + g22*I2 方程式及等效圖。", "version_note": "111_1 期中考官方10頁詳解之第 2 頁，右下角標         // Initialize default recommended PDFs
        pdfConfigs.forEach(c => {
            if (c.is_recommended && c.id !== 'all_recommended') selectedPdfs.add(c.id);
        });

        function getPdfFolder() {
            return currentDocMode === 'question' ? 'PDFs_題目卷_空白測驗版/' : 'PDFs/';
        }
        function getImageFolder() {
            return currentDocMode === 'question' ? 'images_questions/' : 'images/';
        }
        function getPdfFilename(cfg) {
            if (currentDocMode === 'question') {
                return cfg.filename.replace("解答", "題目卷_空白測驗版").replace("詳解", "題目卷_空白測驗版");
            }
            return cfg.filename;
        }
        function getEnglishFilename(cfg) {
            const map = enPdfMapping[cfg.id];
            if (!map) return cfg.filename;
            return currentDocMode === 'question' ? map.q_en : map.sol_en;
        }

        function setDocMode(mode) {
            currentDocMode = mode;
            const btnSol = document.getElementById('btnModeSolution');
            const btnQ = document.getElementById('btnModeQuestion');
            if (mode === 'solution') {
                btnSol.className = 'segmented-btn active';
                btnQ.className = 'segmented-btn';
            } else {
                btnSol.className = 'segmented-btn';
                btnQ.className = 'segmented-btn active question-mode';
            }
            renderCards();
            updateStats();
        }

        function setScenario(scenarioKey) {
            currentScenario = scenarioKey;
            document.querySelectorAll('.filter-chip').forEach(ch => ch.classList.remove('active'));
            const targetChip = document.getElementById('chip-' + scenarioKey);
            if (targetChip) targetChip.classList.add('active');

            // Update bottom nav active state accordingly
            document.querySelectorAll('.nav-tab-item').forEach(t => t.classList.remove('active'));
            if (scenarioKey === 'all_rec') {
                const recTab = document.getElementById('tab-rec');
                if (recTab) recTab.classList.add('active');
            } else if (scenarioKey === 'all') {
                const allTab = document.getElementById('tab-all');
                if (allTab) allTab.classList.add('active');
            }

            renderCards();
        }

        function selectNavTab(tabName) {
            document.querySelectorAll('.nav-tab-item').forEach(t => t.classList.remove('active'));
            const activeTab = document.getElementById('tab-' + tabName);
            if (activeTab) activeTab.classList.add('active');

            if (tabName === 'rec') {
                setScenario('all_rec');
            } else if (tabName === 'all') {
                setScenario('all');
            } else if (tabName === 'practice') {
                setDocMode('question');
                setScenario('all_rec');
            } else if (tabName === 'cloud') {
                window.open('https://github.com/stevenchu152587890625-tech/white-noise/releases/tag/nothing', '_blank');
            } else if (tabName === 'cart') {
                printSelected();
            }
        }

        function toggleSelect(id) {
            if (selectedPdfs.has(id)) {
                selectedPdfs.delete(id);
            } else {
                selectedPdfs.add(id);
            }
            updateStats();
            renderCards();
        }

        function updateStats() {
            let pdfCount = 0;
            let totalPages = 0;
            pdfConfigs.forEach(c => {
                if (selectedPdfs.has(c.id)) {
                    pdfCount += 1;
                    totalPages += c.pages;
                }
            });
            const totalSheets = Math.ceil(totalPages / 2);
            const costMin = totalPages * 2;

            document.getElementById('statPdfCount').innerText = pdfCount;
            document.getElementById('statSheetCount').innerText = `${totalSheets} 張 A4`;
            document.getElementById('statCost').innerText = `NT$ ${costMin}`;
            document.getElementById('cartBadgeCount').innerText = pdfCount;

            const summarySheet = document.getElementById('floatingCartSheet');
            if (pdfCount === 0) {
                summarySheet.style.display = 'none';
            } else {
                summarySheet.style.display = 'flex';
            }
        }

        function onSearchInput() {
            const val = document.getElementById('searchInput').value.trim();
            document.getElementById('searchClearBtn').style.display = val ? 'flex' : 'none';
            renderCards();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('searchClearBtn').style.display = 'none';
            renderCards();
        }

        function toggleDesktopMode() {
            const body = document.body;
            body.classList.toggle('wide-mode');
            const isWide = body.classList.contains('wide-mode');
            document.getElementById('desktopToggleIcon').innerText = isWide ? '📱' : '🖥️';
            document.getElementById('desktopToggleText').innerText = isWide ? 'App' : '寬版';
        }

        function renderCards() {
            const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('appStreamContainer');
            container.innerHTML = '';

            const pdfFolder = getPdfFolder();
            const imgFolder = getImageFolder();

            pdfConfigs.forEach(cfg => {
                if (currentScenario !== 'all') {
                    if (currentScenario === 'all_rec' && !cfg.scenario.includes('all_rec') && cfg.priority === 'redundant') return;
                    if (currentScenario === 'midterm' && !cfg.scenario.includes('midterm')) return;
                    if (currentScenario === 'quiz' && !cfg.scenario.includes('quiz')) return;
                }
                if (searchKeyword) {
                    const fullText = (cfg.title + ' ' + cfg.desc + ' ' + cfg.print_advice + ' ' + cfg.category).toLowerCase();
                    if (!fullText.includes(searchKeyword)) return;
                }

                const isChecked = selectedPdfs.has(cfg.id);
                const isFeatured = (cfg.id === 'all_recommended' || cfg.priority === 'must_print');
                const isRedundant = (cfg.priority === 'redundant');

                const actualPdfName = getPdfFilename(cfg);
                const enFileName = getEnglishFilename(cfg);
                const githubDownloadUrl = GITHUB_DOWNLOAD_BASE + encodeURIComponent(enFileName);

                const displayTitle = currentDocMode === 'question' 
                    ? cfg.title.replace("解答", "空白題目卷").replace("詳解", "空白題目卷") 
                    : cfg.title;

                let thumbsHtml = '';
                cfg.indices.forEach((idx, pNum) => {
                    const item = metaByIdx[idx];
                    if (item) {
                        const imgUrl = imgFolder + encodeURIComponent(item.filename);
                        thumbsHtml += `
                            <div class="app-thumb-box" onclick="openModal('${imgUrl}')" title="點擊放大: ${item.title}">
                                <img src="${imgUrl}" alt="P.${pNum+1}" loading="lazy">
                                <span class="app-thumb-badge">P.${pNum+1}</span>
                            </div>
                        `;
                    }
                });

                let recPillClass = 'rec-good';
                if (cfg.priority === 'all_in_one') recPillClass = 'rec-aio';
                else if (cfg.priority === 'must_print') recPillClass = 'rec-must';
                else if (cfg.priority === 'optional') recPillClass = 'rec-opt';
                else if (cfg.priority === 'redundant') recPillClass = 'rec-skip';

                const card = document.createElement('div');
                card.className = `app-exam-card ${isFeatured ? 'featured' : ''} ${isRedundant ? 'redundant' : ''}`;
                card.innerHTML = `
                    <div class="card-top-row">
                        <div class="card-tags-left">
                            <span class="num-pill">#${cfg.num}</span>
                            <span class="rec-pill ${recPillClass}">${cfg.priority_label}</span>
                            <span class="rec-pill" style="background:#1e293b;color:#cbd5e1;">${cfg.category}</span>
                        </div>
                        <button class="card-check-btn" onclick="toggleSelect('${cfg.id}')" title="加入或取消列印清單">
                            <div class="check-circle ${isChecked ? 'checked' : ''}"></div>
                        </button>
                    </div>

                    <div class="card-body">
                        <h2 class="card-title-text">${displayTitle}</h2>
                        <div class="card-advice-bubble">
                            <strong>💡 建議：</strong>${cfg.print_advice}
                        </div>
                        <div class="card-specs-row">
                            <div class="spec-pill">📄 <strong>${cfg.pages} 頁</strong></div>
                            <div class="spec-pill">📑 雙面 <strong>${cfg.sheets} 張</strong></div>
                            <div class="spec-pill">🎨 <strong>${cfg.color_advice}</strong></div>
                        </div>
                        <div style="margin-top:4px;">
                            <div class="card-thumb-carousel">${thumbsHtml}</div>
                        </div>
                    </div>

                    <div class="card-actions-app">
                        <a href="${githubDownloadUrl}" download="${enFileName}" class="btn-native-dl">
                            <span>⚡</span> 雲端直接下載 (CDN)
                        </a>
                        <a href="${pdfFolder + encodeURIComponent(actualPdfName)}" target="_blank" class="btn-native-preview">
                            <span>👁️</span> 預覽 PDF
                        </a>
                        <button class="btn-native-cart ${isChecked ? 'added' : ''}" onclick="toggleSelect('${cfg.id}')">
                            <span>${isChecked ? '✓ 已加入' : '➕ 加至清單'}</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(url) {
            document.getElementById('modalImg').src = url;
            document.getElementById('imageModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('show');
        }

        function printSelected() {
            const list = [];
            pdfConfigs.forEach(c => {
                if (selectedPdfs.has(c.id)) list.push(getPdfFilename(c));
            });
            if (list.length === 0) {
                alert('請先勾選至少一份要列印的考卷！');
                return;
            }
            let msg = `【已選取 ${list.length} 份 ${currentDocMode === 'question' ? '空白測驗卷' : '解答卷'}】：

` + list.map((f, i) => `${i+1}. ${f}`).join('
') + `

建議列印設定：A4尺寸、雙面列印（長邊翻頁）、配合紙張大小 (Fit)。`;
            alert(msg);
        }

        renderCards();
        updateStats();
    </script>
</body>
</html>
