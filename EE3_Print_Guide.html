OS Common-Gate 放大器電路，含交流小訊號模型與驅動分析。推導 Rin = 1/gm (5%)、Rout = RD // RL (5%)、Av = Vo/Vi = (RD//RL)/(Rsig + 1/gm) (15%) 與兩級電壓比 (Vo/Vg)*(Vg/Vi)。", "version_note": "114_2 標記版本，右上角附完整計分配分標記。", "keywords": "NMOS, CG, Common Gate, Rin, Rout, Av"}, {"index": 6, "filename": "FB_IMG_1792568136115.jpg", "category": "第五次小考 (Quiz 5)", "exam_type": "第五次小考", "year": "114學年度 第2學期 (114_2)", "type": "官方手寫解答", "page_info": "題目2", "title": "題目2：NMOS 放大器 (含源極電阻 Rs, ro ≠ ∞) 交流分析", "desc": "考慮通道長度調變 ro ≠ ∞ 與源極電阻 Rs 之 NMOS 放大器。推導 Rin = R1 // R2 (5%)、Rout = RL // RD // [ro + (1+μ)Rs] (5%) 及整體增益 Av = Vo/Vsig 公式。", "version_note": "114_2 標記版本，詳細標註 μ = gm*ro 及各項配分。", "keywords": "NMOS, ro, Rs, μ=gm*ro, Rin, Rout, Av"}, {"index": 7, "filename": "FB_IMG_1792568137728.jpg", "category": "第五次小考 (Quiz 5)", "exam_type": "第五次小考", "year": "114學年度 第2學期 (114_2)", "type": "官方手寫解答", "page_info": "題目3", "title": "題目3：雙 MOSFET (Q1, Q2) 疊接戴維寧等效電路分析", "desc": "Q1 與 Q2 上下疊接 MOSFET 電路，分別從節點看入進行源極與汲極戴維寧等效 (TEQs, TEQD)。推導輸出電壓 Vo 之嚴謹公式 (25%)。", "version_note": "114_2 標記版本，戴維寧等效 (Thevenin Equivalent) 專題題型。", "keywords": "MOSFET, TEQs, TEQD, 戴維寧等效, Vo"}, {"index": 8, "filename": "FB_IMG_1792568139529.jpg", "category": "第五次小考 (Quiz 5)", "exam_type": "第五次小考", "year": "114學年度 第2學期 (114_2)", "type": "官方手寫解答", "page_info": "題目4", "title": "題目4：三級 MOSFET 放大器 (Q1, Q2, Q3) 交流多級增益分析", "desc": "Q1 (P-MOS/N-MOS), Q2, Q3 組成之三級多級放大器。推導輸入阻抗 Rin = Rs + R1//R2 (5%)、Rout = RL//R10//[ro3+(1+μ3)R9] (5%) 及多級級聯增益 Av = (Vo/Vg3)*(Vg3/Vg2)*(Vg2/Vg1)*(Vg1/Vs) (15%)。", "version_note": "114_2 標記版本，多級串接經典分析題。", "keywords": "三級MOSFET, 多級放大器, Rin, Rout, Av 級聯分解"}, {"index": 9, "filename": "FB_IMG_1792568171678.jpg", "category": "第六次小考 (Quiz 6)", "exam_type": "第六次小考", "year": "114學年度 第1學期 (114_1) [教師更新版]", "type": "官方手寫解答", "page_info": "Page 1 / 題目1 & 題目2", "title": "題目1：OPAMP 差動放大器平衡條件 & 題目2：T型回授網路反相放大器", "desc": "題目1：推導 OPAMP 差動放大器消除共模電壓的平衡條件 R1/R2 = R3/R4 及 Vo = (R2/R1)(V2-V1)；題目2：T 型回授電路 (Ra, Rb, Rc, Rd) 反相增益 Vo/Vi = -(Rb/Ra)[1 + Rd/Rc + Rd/Rb
