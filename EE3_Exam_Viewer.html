<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中原大學 電子學(三) 考試題目與解答檢索瀏覽器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --bg-hover: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --badge-quiz: #0284c7;
            --badge-midterm: #ea580c;
            --badge-notes: #16a34a;
            --badge-update: #d97706;
            --border-color: #334155;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 41, 59, 0.9) 100%);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1.25rem 2rem;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title-group h1 {
            font-size: 1.6rem;
            font-weight: 900;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        .title-group p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            padding: 0.55rem 1rem 0.55rem 2.4rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 280px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            width: 340px;
        }

        .search-box svg {
            position: absolute;
            left: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-secondary);
        }

        .stats-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 9999px;
            padding: 0.35rem 0.85rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .filter-nav {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 2rem;
            position: sticky;
            top: 86px;
            z-index: 40;
            overflow-x: auto;
            white-space: nowrap;
        }

        .filter-container {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-secondary);
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .filter-btn:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .filter-btn.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            font-weight: 700;
        }

        .filter-count {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.1rem 0.45rem;
            border-radius: 999px;
            font-size: 0.75rem;
        }

        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            flex-grow: 1;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            box-shadow: var(--card-shadow);
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.25);
        }

        .card-thumb-container {
            position: relative;
            width: 100%;
            height: 240px;
            background: #090d16;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
        }

        .card-thumb {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .card:hover .card-thumb {
            transform: scale(1.03);
        }

        .card-badge-top-left {
            position: absolute;
            top: 0.75rem;
            left: 0.75rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
        }

        .card-badge-top-right {
            position: absolute;
            top: 0.75rem;
            right: 0.75rem;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-quiz { color: #38bdf8; border-color: rgba(56, 189, 248, 0.4); }
        .badge-midterm { color: #fb923c; border-color: rgba(251, 146, 60, 0.4); }
        .badge-notes { color: #4ade80; border-color: rgba(74, 222, 128, 0.4); }

        .card-body {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            gap: 0.6rem;
        }

        .card-meta-line {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .card-year {
            color: #facc15;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .card-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.5;
            flex-grow: 1;
        }

        .card-version-box {
            background: rgba(217, 119, 6, 0.1);
            border-left: 3px solid #f59e0b;
            padding: 0.5rem 0.75rem;
            border-radius: 0 6px 6px 0;
            font-size: 0.78rem;
            color: #fde68a;
            margin-top: 0.4rem;
        }

        .card-footer {
            margin-top: 0.5rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .card-filename {
            font-family: 'JetBrains Mono', monospace;
            max-width: 220px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Modal Viewer */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 15, 30, 0.95);
            backdrop-filter: blur(12px);
            z-index: 100;
            flex-direction: column;
        }

        .modal.active {
            display: flex;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title-group h2 {
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .modal-title-group p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .modal-btn {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .modal-btn:hover {
            background: var(--accent);
            color: #0f172a;
            border-color: var(--accent);
        }

        .modal-body {
            flex-grow: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .modal-img-container {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: auto;
        }

        .modal-img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .modal-sidebar {
            width: 420px;
            background: rgba(15, 23, 42, 0.95);
            border-left: 1px solid var(--border-color);
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .modal-sidebar-section h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent);
            margin-bottom: 0.5rem;
        }

        .modal-nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 10;
        }

        .modal-nav-arrow:hover {
            background: var(--accent);
            color: #0f172a;
            transform: translateY(-50%) scale(1.1);
        }

        .nav-prev { left: 1.5rem; }
        .nav-next { right: calc(420px + 1.5rem); }

        @media (max-width: 1024px) {
            .modal-body {
                flex-direction: column;
            }
            .modal-sidebar {
                width: 100%;
                border-left: none;
                border-top: 1px solid var(--border-color);
                max-height: 250px;
            }
            .nav-next { right: 1.5rem; }
        }
    </style>
</head>

    <main>

    <!-- Modal Lightbox -->
    <div class="modal" id="imageModal">
        <div class="modal-header">
            <div class="modal-title-group">
                <h2 id="modalTitle">標題</h2>

                    <p style="font-size: 0.8rem; color: #64748b; margin-top: 0.3rem;" id="modalKeywords"></p>
                </div>
            </div>
        </div>
    </div>
